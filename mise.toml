[env]
_.file = ".env"

[tasks.start]
description = "Prepare all prerequisites (Ansible) and start stack"
run = '''
#!/usr/bin/env bash
set -euo pipefail

# 1. Run Ansible to generate .env, truststore certs, and wildcard TLS cert
if [ -f playbook.yml ] && [ -f ansible/group_vars/all/vault.yml ]; then
  ansible_ee="${ANSIBLE_EE_IMAGE:-khalibre/ansible-ee:2.20.2-2026-3}"
  vault_pass_file="${ANSIBLE_VAULT_PASSWORD_FILE:-/etc/ansible/.ansible-vault-common.py}"

  # Synthesize a passwd entry for the current host user so the container
  # can resolve UID -> username without needing GID 0 or a writable /etc/passwd.
  runner_passwd="$(mktemp)"
  echo "runner:x:$(id -u):$(id -g):runner:/project:/bin/bash" > "${runner_passwd}"
  trap 'rm -f "${runner_passwd}"' EXIT

  docker run --rm \
    -u "$(id -u):$(id -g)" \
    -w /project \
    -v "$PWD:/project" \
    -v "${vault_pass_file}:${vault_pass_file}:ro" \
    -v "${runner_passwd}:/etc/passwd:ro" \
    -e "ANSIBLE_VAULT_PASSWORD_FILE=${vault_pass_file}" \
    -e ANSIBLE_ROLES_PATH=/project/ansible/roles \
    -e HOME=/project \
    "${ansible_ee}" \
    ansible-playbook playbook.yml \
      -e @ansible/group_vars/all/vars.yml \
      -e @ansible/group_vars/all/vault.yml \
      -e project_dir=/project
fi

# 2. Source environment and bring up stack
set -a; source .env; set +a
docker compose up -d

echo "--------------------------------------------------------"
echo "Keycloak:    https://${KEYCLOAK_HOST}"
echo "PrivacyIDEA: https://${PI_HOST}"
echo "Traefik:     http://localhost:${TRAEFIK_DASHBOARD_PORT}"
echo "--------------------------------------------------------"

# 3. Notify user about manual DB restore
db_file="databases/mariadb_backup_20260914_164148.tar.gz"
if [ -f "$db_file" ]; then
  echo ""
  echo "=> A database backup was downloaded from S3 to:"
  echo "   $db_file"
  echo "=> To restore this backup into MariaDB, run:"
  echo "   mise run db:restore $db_file"
fi
'''
[tasks."start:services"]
description = "Start docker compose"
run = "docker compose up -d"

[tasks.down]
description = "Stop and remove the stack (keeps volumes)"
run = "docker compose down"

[tasks.stop]
description = "Stop the stack"
run = "docker compose stop"

[tasks."stop:keycloak"]
description = "Stop keycloak"
run = "docker compose stop keycloak"

[tasks."stop:mariadb"]
description = "Stop mariadb"
run = "docker compose stop mariadb"

[tasks."stop:pi"]
description = "Stop privacy-idea"
run = "docker compose stop privacyidea"

[tasks."start:mariadb"]
description = "start mariadb"
run = "docker compose start mariadb"

[tasks."start:pi"]
description = "start privacy-idea"
run = "docker compose start privacyidea"

[tasks.restart]
description = "Restart the stack"
run = "docker compose restart"

[tasks."logs:keycloak"]
description = "Follow keycloak logs"
run = "docker logs -f mfa-keycloak"

[tasks."logs:privacyidea"]
description = "Follow privacyidea logs"
run = "docker logs -f mfa-privacyidea"

[tasks."logs:mariadb"]
description = "Follow mariadb logs"
run = "docker logs -f mfa-mariadb"

[tasks.ps]
description = "List stack containers"
run = "docker compose ps"

[tasks.pull]
description = "Pull all images"
run = "docker compose pull"

[tasks.destroy]
description = "Stop and remove the stack, volumes, generated certificates, and database backups"
alias = "clean"
run = '''
#!/usr/bin/env bash
set -euo pipefail
docker compose down -v
rm -f certs/wildcard.crt certs/wildcard.key certs/truststore/*.crt
rm -rf databases/*.tar.gz
rm -rf databases/export/*.tar.gz
echo "Removed stack, volumes, generated certificates, and database backups."
'''

[tasks."start:keycloak"]
description = "Start Keycloak service"
run = "docker compose up -d keycloak"

[tasks."start:privacyidea"]
description = "Start PrivacyIDEA service"
run = "docker compose up -d privacyidea"

[tasks."db:export"]
description = "Export MariaDB application databases to a compressed tar.gz file"
run = '''
#!/usr/bin/env bash
set -euo pipefail
set -a; source .env; set +a
mkdir -p databases/export
timestamp=$(date +"%Y%m%d_%H%M%S")
sqlfile="mariadb_backup_${timestamp}.sql"
tarfile="databases/export/mariadb_backup_${timestamp}.tar.gz"
echo "Exporting databases: ${KEYCLOAK_DB_NAME} ${PI_DB_NAME}..."
docker exec mfa-mariadb mariadb-dump -uroot -p"${MYSQL_ROOT_PASSWORD}" \
  --databases "${KEYCLOAK_DB_NAME}" "${PI_DB_NAME}" > "databases/export/${sqlfile}"
echo "Compressing to ${tarfile}..."
tar -czvf "${tarfile}" -C databases/export "${sqlfile}"
rm "databases/export/${sqlfile}"
echo "Export complete: ${tarfile}"
'''

[tasks."db:restore"]
description = "Restore MariaDB application databases from a compressed tar.gz file (defaults to the latest in databases/)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
set -a; source .env; set +a

if [ $# -eq 0 ]; then
  infile="$(ls -t databases/*.tar.gz 2>/dev/null | head -n1)"
  if [ -z "${infile}" ]; then
    echo "Error: No backup file given and none found in databases/"
    echo "Usage: mise run db:restore [backup_file.tar.gz]"
    exit 1
  fi
  echo "No file specified — using most recent backup: ${infile}"
else
  infile="$1"
fi

if [ ! -f "${infile}" ]; then
  echo "Error: File not found: ${infile}"
  exit 1
fi

echo "Restoring databases from ${infile}..."
tmp_sql="$(mktemp --suffix=.sql)"
trap 'rm -f "${tmp_sql}"' EXIT
tar -xzvOf "${infile}" > "${tmp_sql}"

for db in "${KEYCLOAK_DB_NAME}" "${PI_DB_NAME}"; do
  echo "  -> restoring ${db} (system tables always skipped)..."
  docker exec -i mfa-mariadb mariadb -uroot -p"${MYSQL_ROOT_PASSWORD}" --one-database "${db}" < "${tmp_sql}"
done
echo "Restore complete."

echo "Resyncing healthcheck credentials..."
docker exec mfa-mariadb rm -f /var/lib/mysql/.my-healthcheck.cnf
docker restart mfa-mariadb

echo "Waiting for mfa-mariadb to report healthy..."
for i in $(seq 1 30); do
  status="$(docker inspect mfa-mariadb 2>/dev/null | jq -r '.[0].State.Health.Status // "starting"')"
  if [ "${status}" = "healthy" ]; then
    echo "mfa-mariadb is healthy."
    exit 0
  fi
  sleep 2
done

echo "Warning: mfa-mariadb did not report healthy within 60s — check 'docker logs mfa-mariadb'."
'''
